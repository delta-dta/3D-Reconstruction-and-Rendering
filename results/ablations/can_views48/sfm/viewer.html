function project(p){let x=Math.cos(yaw)*p[0]-Math.sin(yaw)*p[1],y=Math.sin(yaw)*p[0]+Math.cos(yaw)*p[1];return [450+x*scale,310-(Math.cos(pitch)*p[2]-Math.sin(pitch)*y)*scale,Math.sin(pitch)*p[2]+Math.cos(pitch)*y];}
